    }
    #install-pwa-btn:hover {
      background: #2980b9;
    }
    [data-theme="dark"] #install-pwa-btn {
      background: #2c3e50;
    }
    [data-theme="dark"] #install-pwa-btn:hover {      background: #1a252f;
    }
    /* إخفاء الزر افتراضياً حتى يتأكد الجافاسكريبت من إمكانية التثبيت */
    #install-pwa-btn {
      display: none; 
    }
  </style>

  <!-- Scripts (Only Main Logic) -->
  <!-- تم إزالة جميع ملفات الألعاب والمستويات -->
  <script src="scripts/main.js"></script>
  
  <!-- كود بسيط للتحقق من ظهور زر التثبيت في الكونسول للمساعدة -->
  <script>
    window.addEventListener('beforeinstallprompt', (e) => {      console.log('✅ حدث التثبيت متاح!');
      e.preventDefault();
      const btn = document.getElementById('install-pwa-btn');
      if(btn) {
        btn.style.display = 'flex';
        btn.onclick = () => {
          e.prompt();
          e.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('تم قبول التثبيت');
            } else {
              console.log('تم رفض التثبيت');
            }
            btn.style.display = 'none';
          });
        };
      }
    });

    window.addEventListener('appinstalled', () => {
      console.log('🎉 تم تثبيت التطبيق بنجاح!');
      document.getElementById('install-pwa-btn').style.display = 'none';
    });
  </script>
